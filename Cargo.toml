[package]
name = "simplesharingshouldnotbethishard"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
axum = { version = "0.7.9", features = ["multipart"] }
axum-extra = { version = "0.9.6", features = ["typed-header"] }
axum-htmx = "0.6.0"
axum-range = "0.4.0"
axum_thiserror = "0.1.0"
chrono = "0.4.39"
cron = "0.14.0"
futures = "0.3.31"
humantime = "2.1.0"
maud = { version = "0.26.0", features = ["axum"] }
mime_guess = "2.0.5"
opendal = "0.45"
phf = { version = "0.11.2", features = ["macros"] }
relative-path = { version = "1.9.3", features = ["serde"] }
serde = "1.0.217"
shuttle-axum = "0.49.0"
shuttle-opendal = "0.49.0"
shuttle-runtime = { version = "0.49.0", default-features = false }
thiserror = "2.0.9"
tokio = "1.42.0"
tokio-cron-scheduler = "0.13.0"
tokio-util = "0.7.13"
tower-http = { version = "0.6.2", features = ["trace", "fs"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = { version = "1.11.0", features = ["v7"] }
itertools = "0.13.0"

[dev-dependencies]
cargo-watch = "8.5.3"
